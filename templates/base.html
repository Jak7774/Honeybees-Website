<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beehive Monitoring System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .section-divider {
            border: none;
            height: 8px;
            background-color: #FFC800; /* Bootstrap primary color */
            margin-top: 20px;
            margin-bottom: 20px;
        }

        /* Bigger hive tabs */
        .hive-tabs .nav-tabs .nav-link {
            font-size: 1.1rem;
            padding: 0.75rem 1.25rem;
            background-color: #f0f0f0; /* Light grey background */
            color: #333; /* Dark text for better contrast */
            padding: 1rem 5rem; /* Increase padding to make tabs wider */
            width: auto; /* Allow the width to be flexible based on content */
            text-align: center; /* Center the text in the tab */
        }

        .hive-tabs .nav-tabs {
            border-bottom: none; 
        }

        .hive-tabs .border-bottom {
            border-bottom: 5px solid #dee2e6 !important; /* thicker, soft gray */
        }

        .nav-tabs .nav-link.active {
            background-color: #ffffff; 
            color: #0d6efd; 
            border-bottom: none;
            border-top: 3px solid #0d6efd;
        }

        .hive-tabs .nav-link:not(.active) {
            color: #333; /* Darker text color for non-active tabs */
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Beehive Monitoring System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/all_data">All Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/temperature">Temperature Readings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/humidity">Humidity Readings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/weight">Weight Readings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
          
    {% if current_beehive_id %} 
    <!-- Hive tabs (bigger and below navbar) -->
    <div class="hive-tabs mb-4">
        <div class="d-flex border-bottom">
          <ul class="nav nav-tabs ms-auto">
            {% for hive in hive_list %}
              <li class="nav-item">
                <a class="nav-link {% if hive == beehive_id %}active{% endif %}"
                   href="{{ url_for(request.endpoint, beehive_id=hive) }}">
                  <strong>Hive {{ hive }}</strong>
                </a>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    {% endif %}

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
